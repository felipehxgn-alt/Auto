name: Diagnóstico Fotos e Status ML

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Rodar diagnostico (status + fotos + classificacao IA)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PLANILHA_ANUNCIOS_ML_ID: ${{ secrets.PLANILHA_ANUNCIOS_ML_ID }}
        run: python diagnostico_fotos_ml.py data/item_ids_catalogo.csv
