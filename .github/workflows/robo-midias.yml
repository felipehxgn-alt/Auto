name: Robo de Midias

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  processar-midias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
          DEST_ROOT_FOLDER_ID: ${{ secrets.DEST_ROOT_FOLDER_ID }}
          LOGO_FOLDER_ID: ${{ secrets.LOGO_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PHOTOROOM_API_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
        run: python Main
